version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: afm-backend:local
    container_name: afm-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: afm-frontend:local
    container_name: afm-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend 
